[package]
name = "chia-peer"
version = "0.3.0"
edition = "2021"
description = "DEPRECATED — folded into chia-query. A thin re-export facade over chia_query::peer::light_client"
license = "MIT"
repository = "https://github.com/DIG-Network/chia-peer"
readme = "README.md"
keywords = ["chia", "deprecated", "light-client", "peer", "chia-query"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
# The ONLY dependency, and deliberately so: this crate implements nothing and exists to point at
# the crate that does (dig_ecosystem#2761). The whole wallet-protocol stack it used to carry —
# `chia-wallet-sdk`, `chia-protocol`, `dig-chainsource-interface`, tokio, tokio-tungstenite,
# async-trait, rand, futures-util, and the Linux vendored-OpenSSL block — is gone, because the code
# that needed it is gone.
#
# A caret requirement, not an exact-equals. The `=0.5.1` pin this crate's existence forced on
# `dig-node-core` is exactly what the fold removed, and reintroducing that shape here would recreate
# it one layer up.
chia-query = "0.15"
