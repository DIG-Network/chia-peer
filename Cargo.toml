[package]
name = "chia-peer"
version = "0.4.0"
edition = "2021"
description = "DIG Chia light-client connectivity: a wallet-protocol full-node client + ChainSource provider (dig-node seam 1)"
license = "MIT"
repository = "https://github.com/DIG-Network/chia-peer"
readme = "README.md"
keywords = ["chia", "blockchain", "light-client", "wallet-protocol", "peer"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
# The canonical reads-only ChainSource provider interface this crate implements.
# `chia-protocol` is pulled in directly so the provider speaks the exact
# `chia_protocol` types the interface exposes (cargo unifies it with the SDK's
# re-export at the same 0.36.x).
#
# There is deliberately NO `chia` umbrella dependency: the umbrella crate has no
# 0.36 release (crates.io jumps 0.32.0 -> 0.42.0), so it cannot be held on the
# `chia-protocol 0.36.1` line the interface and the SDK both require. The four
# umbrella modules this crate used (`bls`, `ssl`, `traits`, `clvm_utils`) are
# re-exported by chia-wallet-sdk, which guarantees they are the SAME types the
# SDK's own `Peer`/`connect_peer` signatures expect.
#
# `lineage-walk` supplies the canonical launcher→tip singleton walk this crate's
# `resolve_singleton_lineage` delegates to. It is a NON-default feature because it pulls a CLVM
# evaluator (chia-puzzle-types / chia-puzzles / chia-sdk-driver / chia-sdk-types / clvm-traits /
# clvm-utils / clvmr) — every one of which sits on the same chia-protocol 0.36.1 / SDK 0.34 line
# this crate already rides, so enabling it moves no other version.
dig-chainsource-interface = { version = "0.3", features = ["lineage-walk"] }
chia-protocol = "0.36.1"
chia-wallet-sdk = { version = "0.34", features = ["native-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
async-trait = "0.1"
thiserror = "2"
hex = "0.4"
log = "0.4"
rand = "0.8"
futures-util = "0.3"

[dev-dependencies]
# `testing` feature enables the in-memory MockChainSource used by provider tests.
dig-chainsource-interface = { version = "0.3", features = ["lineage-walk", "testing"] }
# `peer-simulator` provides an in-process wallet-protocol full node so the peer fetcher + light
# client are tested end-to-end (connect, subscribe, submit, reorg) without a live network.
chia-wallet-sdk = { version = "0.34", features = ["native-tls", "peer-simulator"] }

# Linux-only vendored OpenSSL for the native TLS stack (matches chia-query's
# native build so CI links the same way).
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
